# プロジェクトの身分（配布名・バージョン・実行に必要な依存）
[project]
name = "comprehension-check"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9", # フォーム受信
    "markdown-it-py>=3",       # Markdown → HTML（ブロックの元ソース行情報が取れる）
]

# これがあると uv がこのプロジェクトをパッケージとして editable install する（＝どこからでも import 可）
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# パッケージの場所を明示
[tool.hatch.build.targets.wheel]
packages = ["src/comprehension_check"]

# 開発時だけ必要な道具（uv add --dev で追加）
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "RUF", "DTZ"]
# 日本語の全角括弧・記号を「紛らわしい文字」と誤検出する規則は除外する
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
